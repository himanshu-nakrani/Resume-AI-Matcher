openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Resume analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List all analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create a new resume analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisBody"
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get an analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateAnalysis
      tags: [analyses]
      summary: Update an analysis (status, notes, favorite, tracking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnalysisBody"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/duplicate:
    post:
      operationId: duplicateAnalysis
      tags: [analyses]
      summary: Duplicate an analysis (clone resume+JD for comparison)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicate analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/salary-guide:
    post:
      operationId: generateSalaryGuide
      tags: [analyses]
      summary: Generate AI salary range estimate for this role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Salary guide generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryGuideResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/company-research:
    post:
      operationId: generateCompanyResearch
      tags: [analyses]
      summary: Generate AI-powered company research brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company research generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResearchResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/red-flags:
    post:
      operationId: detectRedFlags
      tags: [analyses]
      summary: Detect potential red flags in the job description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Red flags detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedFlagsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/negotiate:
    post:
      operationId: simulateNegotiation
      tags: [analyses]
      summary: Run a salary negotiation simulation turn (AI plays recruiter)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiateBody"
      responses:
        "200":
          description: Negotiation turn response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/star-answer:
    post:
      operationId: generateStarAnswer
      tags: [analyses]
      summary: Generate a polished STAR-method answer for an interview question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarAnswerBody"
      responses:
        "200":
          description: STAR answer generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarAnswerResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/cover-letter:
    post:
      operationId: generateCoverLetter
      tags: [analyses]
      summary: Generate a tailored cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoverLetterBody"
      responses:
        "200":
          description: Cover letter generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/learning-plan:
    post:
      operationId: generateLearningPlan
      tags: [analyses]
      summary: Generate a personalized learning plan to close skill gaps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Learning plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPlanResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/interview-questions:
    post:
      operationId: generateInterviewQuestions
      tags: [analyses]
      summary: Generate likely interview questions for this role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview questions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestionsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/rewrite-bullet:
    post:
      operationId: rewriteBullet
      tags: [analyses]
      summary: Rewrite a resume bullet point using job context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteBulletBody"
      responses:
        "200":
          description: Rewritten bullet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewriteBulletResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/linkedin-post:
    post:
      operationId: generateLinkedinPost
      tags: [analyses]
      summary: Generate a LinkedIn post about the job application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LinkedIn post generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/share:
    post:
      operationId: shareAnalysis
      tags: [analyses]
      summary: Generate a public share link for this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unshareAnalysis
      tags: [analyses]
      summary: Remove public sharing from this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unshared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /share/{token}:
    get:
      operationId: getSharedAnalysis
      tags: [analyses]
      summary: Get a publicly shared analysis by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found or not public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fetch-job:
    post:
      operationId: fetchJobDescription
      tags: [analyses]
      summary: Fetch and extract job description text from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchJobBody"
      responses:
        "200":
          description: Job description extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchJobResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job-search:
    post:
      operationId: searchJobs
      tags: [analyses]
      summary: Search the web for job postings via Exa
      description: >
        Proxies to Exa `POST https://api.exa.ai/search` with highlights. Requires `EXA_API_KEY` on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchBody"
      responses:
        "200":
          description: Normalized search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Exa API error or invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Exa not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/stats:
    get:
      operationId: getAnalysisStats
      tags: [analyses]
      summary: Get aggregate stats across all analyses
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStats"

  /notifications:
    get:
      operationId: listNotifications
      tags: [analyses]
      summary: List all notifications
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    patch:
      operationId: markAllNotificationsRead
      tags: [analyses]
      summary: Mark all notifications as read
      responses:
        "204":
          description: All marked read

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [analyses]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/market-insights:
    post:
      operationId: generateMarketInsights
      tags: [analyses]
      summary: Generate AI-powered job market insights for this role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Market insights generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketInsightsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/career-path:
    post:
      operationId: generateCareerPath
      tags: [analyses]
      summary: Generate an AI-powered career path progression map
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career path generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/follow-up-email:
    post:
      operationId: generateFollowUpEmail
      tags: [analyses]
      summary: Generate a smart follow-up email for this application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpEmailBody"
      responses:
        "200":
          description: Follow-up email generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpEmailResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/predict-offer:
    post:
      operationId: predictOffer
      tags: [analyses]
      summary: Predict offer likelihood using AI analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer prediction generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictOfferResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/mock-interview:
    post:
      operationId: conductMockInterview
      tags: [analyses]
      summary: Conduct one turn of an AI mock interview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockInterviewBody"
      responses:
        "200":
          description: Mock interview turn response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockInterviewResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/practice-feedback:
    post:
      operationId: getPracticeFeedback
      tags: [analyses]
      summary: Score a timed STAR interview answer with AI feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeFeedbackBody"
      responses:
        "200":
          description: Practice feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeFeedbackResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Analysis:
      type: object
      properties:
        id:
          type: integer
        jobTitle:
          type: string
        companyName:
          type: ["string", "null"]
        resumeText:
          type: string
        originalFileName:
          type: ["string", "null"]
        originalFileType:
          type: string
          enum: [pdf, latex, text]
        sourceLatex:
          type: ["string", "null"]
        optimizedLatex:
          type: ["string", "null"]
        jobDescriptionText:
          type: string
        fitScore:
          type: integer
        fitRationale:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        atsKeywordsMatched:
          type: array
          items:
            type: string
        atsKeywordsMissing:
          type: array
          items:
            type: string
        atsScore:
          type: integer
        coverLetter:
          type: ["string", "null"]
        linkedinPost:
          type: ["string", "null"]
        status:
          type: string
          enum: [not_applied, applied, got_interview, got_online_exam, selected, rejected]
        interviewQuestions:
          type: array
          items:
            type: string
        learningPlan:
          type: array
          items:
            $ref: "#/components/schemas/LearningPlanItem"
        isFavorite:
          type: boolean
        notes:
          type: ["string", "null"]
        shareToken:
          type: ["string", "null"]
        isPublic:
          type: boolean
        deadline:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        followUpDate:
          type: ["string", "null"]
        salaryGuide:
          nullable: true
          $ref: "#/components/schemas/SalaryRange"
        tags:
          type: array
          items:
            type: string
        companyResearch:
          nullable: true
          $ref: "#/components/schemas/CompanyResearch"
        redFlags:
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/RedFlag"
        portfolioLinks:
          type: array
          items:
            type: string
        versionLabel:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salaryExpectation:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - jobTitle
        - companyName
        - resumeText
        - originalFileName
        - originalFileType
        - sourceLatex
        - optimizedLatex
        - jobDescriptionText
        - fitScore
        - fitRationale
        - strengths
        - gaps
        - improvements
        - atsKeywordsMatched
        - atsKeywordsMissing
        - atsScore
        - coverLetter
        - linkedinPost
        - status
        - interviewQuestions
        - learningPlan
        - isFavorite
        - notes
        - shareToken
        - isPublic
        - deadline
        - contactName
        - contactEmail
        - followUpDate
        - tags
        - createdAt

    CreateAnalysisBody:
      type: object
      properties:
        jobTitle:
          type: string
        companyName:
          type: string
        resumeText:
          type: string
        originalFileName:
          type: string
        originalFileType:
          type: string
          enum: [pdf, latex, text]
        sourceLatex:
          type: string
        deepseekApiKey:
          type: string
        jobDescriptionText:
          type: string
      required:
        - jobTitle
        - resumeText
        - jobDescriptionText

    UpdateAnalysisBody:
      type: object
      properties:
        status:
          type: string
          enum: [not_applied, applied, got_interview, got_online_exam, selected, rejected]
        notes:
          type: string
        isFavorite:
          type: boolean
        deadline:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        followUpDate:
          type: string
        tags:
          type: array
          items:
            type: string
        portfolioLinks:
          type: array
          items:
            type: string
        versionLabel:
          type: string
        location:
          type: string
        salaryExpectation:
          type: string

    SalaryRange:
      type: object
      properties:
        low:
          type: integer
        mid:
          type: integer
        high:
          type: integer
        currency:
          type: string
        period:
          type: string
          enum: [year, month, hour]
        context:
          type: string
        factors:
          type: array
          items:
            type: string
        negotiationTips:
          type: array
          items:
            type: string
      required:
        - low
        - mid
        - high
        - currency
        - period
        - context
        - factors
        - negotiationTips

    SalaryGuideResponse:
      type: object
      properties:
        low:
          type: integer
        mid:
          type: integer
        high:
          type: integer
        currency:
          type: string
        period:
          type: string
          enum: [year, month, hour]
        context:
          type: string
        factors:
          type: array
          items:
            type: string
        negotiationTips:
          type: array
          items:
            type: string
      required:
        - low
        - mid
        - high
        - currency
        - period
        - context
        - factors
        - negotiationTips

    CompanyResearch:
      type: object
      properties:
        overview:
          type: string
        culture:
          type: string
        interviewProcess:
          type: string
        recentNews:
          type: array
          items:
            type: string
        glassdoorRating:
          type: string
        tips:
          type: array
          items:
            type: string
      required:
        - overview
        - culture
        - interviewProcess
        - recentNews
        - glassdoorRating
        - tips

    CompanyResearchResponse:
      type: object
      properties:
        overview:
          type: string
        culture:
          type: string
        interviewProcess:
          type: string
        recentNews:
          type: array
          items:
            type: string
        glassdoorRating:
          type: string
        tips:
          type: array
          items:
            type: string
      required:
        - overview
        - culture
        - interviewProcess
        - recentNews
        - glassdoorRating
        - tips

    RedFlag:
      type: object
      properties:
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        description:
          type: string
        quote:
          type: string
      required:
        - severity
        - title
        - description
        - quote

    RedFlagsResponse:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/RedFlag"
        summary:
          type: string
        overallRisk:
          type: string
          enum: [low, medium, high]
      required:
        - flags
        - summary
        - overallRisk

    NegotiateBody:
      type: object
      properties:
        messages:
          type: array
          items:
