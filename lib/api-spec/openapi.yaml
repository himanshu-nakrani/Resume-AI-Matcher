openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Resume analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List all analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create a new resume analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisBody"
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get an analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateAnalysis
      tags: [analyses]
      summary: Update an analysis (status, notes, favorite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnalysisBody"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/cover-letter:
    post:
      operationId: generateCoverLetter
      tags: [analyses]
      summary: Generate a tailored cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoverLetterBody"
      responses:
        "200":
          description: Cover letter generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/learning-plan:
    post:
      operationId: generateLearningPlan
      tags: [analyses]
      summary: Generate a personalized learning plan to close skill gaps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Learning plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPlanResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/interview-questions:
    post:
      operationId: generateInterviewQuestions
      tags: [analyses]
      summary: Generate likely interview questions for this role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview questions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestionsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/rewrite-bullet:
    post:
      operationId: rewriteBullet
      tags: [analyses]
      summary: Rewrite a resume bullet point using job context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteBulletBody"
      responses:
        "200":
          description: Rewritten bullet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewriteBulletResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/linkedin-post:
    post:
      operationId: generateLinkedinPost
      tags: [analyses]
      summary: Generate a LinkedIn post about the job application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LinkedIn post generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/share:
    post:
      operationId: shareAnalysis
      tags: [analyses]
      summary: Generate a public share link for this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unshareAnalysis
      tags: [analyses]
      summary: Remove public sharing from this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unshared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /share/{token}:
    get:
      operationId: getSharedAnalysis
      tags: [analyses]
      summary: Get a publicly shared analysis by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found or not public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fetch-job:
    post:
      operationId: fetchJobDescription
      tags: [analyses]
      summary: Fetch and extract job description text from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchJobBody"
      responses:
        "200":
          description: Job description extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchJobResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/stats:
    get:
      operationId: getAnalysisStats
      tags: [analyses]
      summary: Get aggregate stats across all analyses
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Analysis:
      type: object
      properties:
        id:
          type: integer
        jobTitle:
          type: string
        companyName:
          type: ["string", "null"]
        resumeText:
          type: string
        jobDescriptionText:
          type: string
        fitScore:
          type: integer
        fitRationale:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        atsKeywordsMatched:
          type: array
          items:
            type: string
        atsKeywordsMissing:
          type: array
          items:
            type: string
        atsScore:
          type: integer
        coverLetter:
          type: ["string", "null"]
        linkedinPost:
          type: ["string", "null"]
        status:
          type: string
          enum: [not_applied, applied, interview, offer, rejected]
        interviewQuestions:
          type: array
          items:
            type: string
        learningPlan:
          type: array
          items:
            $ref: "#/components/schemas/LearningPlanItem"
        isFavorite:
          type: boolean
        notes:
          type: ["string", "null"]
        shareToken:
          type: ["string", "null"]
        isPublic:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - jobTitle
        - companyName
        - resumeText
        - jobDescriptionText
        - fitScore
        - fitRationale
        - strengths
        - gaps
        - improvements
        - atsKeywordsMatched
        - atsKeywordsMissing
        - atsScore
        - coverLetter
        - linkedinPost
        - status
        - interviewQuestions
        - learningPlan
        - isFavorite
        - notes
        - shareToken
        - isPublic
        - createdAt

    CreateAnalysisBody:
      type: object
      properties:
        jobTitle:
          type: string
        companyName:
          type: string
        resumeText:
          type: string
        jobDescriptionText:
          type: string
      required:
        - jobTitle
        - resumeText
        - jobDescriptionText

    UpdateAnalysisBody:
      type: object
      properties:
        status:
          type: string
          enum: [not_applied, applied, interview, offer, rejected]
        notes:
          type: string
        isFavorite:
          type: boolean

    ShareResponse:
      type: object
      properties:
        shareToken:
          type: string
        shareUrl:
          type: string
      required:
        - shareToken
        - shareUrl

    FetchJobBody:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    FetchJobResponse:
      type: object
      properties:
        jobDescription:
          type: string
        jobTitle:
          type: string
        companyName:
          type: string
      required:
        - jobDescription

    InterviewQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            type: string
      required:
        - questions

    GenerateCoverLetterBody:
      type: object
      properties:
        tone:
          type: string

    RewriteBulletBody:
      type: object
      properties:
        bulletText:
          type: string
      required:
        - bulletText

    RewriteBulletResponse:
      type: object
      properties:
        original:
          type: string
        rewritten:
          type: string
      required:
        - original
        - rewritten

    GeneratedContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    LearningResource:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [course, certification, project, book, article]
        description:
          type: string
        platform:
          type: ["string", "null"]
      required:
        - title
        - type
        - description

    LearningPlanItem:
      type: object
      properties:
        skill:
          type: string
        why:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        resources:
          type: array
          items:
            $ref: "#/components/schemas/LearningResource"
      required:
        - skill
        - why
        - priority
        - resources

    LearningPlanResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LearningPlanItem"
      required:
        - items

    AnalysisStats:
      type: object
      properties:
        totalAnalyses:
          type: integer
        averageFitScore:
          type: number
        averageAtsScore:
          type: number
        topMissingKeywords:
          type: array
          items:
            type: string
      required:
        - totalAnalyses
        - averageFitScore
        - averageAtsScore
        - topMissingKeywords
