openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Resume analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /status:
    get:
      operationId: getSystemStatus
      tags: [health]
      summary: System capability status
      description: Returns non-secret server capability flags for AI, job search, and PDF export.
      responses:
        "200":
          description: Capability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List all analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create a new resume analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisBody"
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get an analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateAnalysis
      tags: [analyses]
      summary: Update an analysis (status, notes, favorite, tracking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnalysisBody"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/duplicate:
    post:
      operationId: duplicateAnalysis
      tags: [analyses]
      summary: Duplicate an analysis (clone resume+JD for comparison)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicate analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/cover-letter:
    post:
      operationId: generateCoverLetter
      tags: [analyses]
      summary: Generate a tailored cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoverLetterBody"
      responses:
        "200":
          description: Cover letter generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/rewrite-bullet:
    post:
      operationId: rewriteBullet
      tags: [analyses]
      summary: Rewrite a resume bullet point using job context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteBulletBody"
      responses:
        "200":
          description: Rewritten bullet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewriteBulletResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/linkedin-post:
    post:
      operationId: generateLinkedinPost
      tags: [analyses]
      summary: Generate a LinkedIn post about the job application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LinkedIn post generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/{id}/share:
    post:
      operationId: shareAnalysis
      tags: [analyses]
      summary: Generate a public share link for this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unshareAnalysis
      tags: [analyses]
      summary: Remove public sharing from this analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unshared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /share/{token}:
    get:
      operationId: getSharedAnalysis
      tags: [analyses]
      summary: Get a publicly shared analysis by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found or not public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fetch-job:
    post:
      operationId: fetchJobDescription
      tags: [analyses]
      summary: Fetch and extract job description text from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchJobBody"
      responses:
        "200":
          description: Job description extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchJobResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job-search:
    post:
      operationId: searchJobs
      tags: [analyses]
      summary: Search the web for job postings via Exa
      description: >
        Proxies to Exa `POST https://api.exa.ai/search` with highlights. Requires `EXA_API_KEY` on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchBody"
      responses:
        "200":
          description: Normalized search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Exa API error or invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Exa not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job-search/enrich:
    post:
      operationId: enrichJobContent
      tags: [analyses]
      summary: Fetch and structure a single job posting via Exa /contents
      description: >
        Server-side crawl of a job posting URL via Exa `POST /contents` with a
        JSON-schema summary for structured field extraction. Cached for 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichJobBody"
      responses:
        "200":
          description: Enriched job content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichJobResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Exa fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Exa not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyses/stats:
    get:
      operationId: getAnalysisStats
      tags: [analyses]
      summary: Get aggregate stats across all analyses
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStats"

  /notifications:
    get:
      operationId: listNotifications
      tags: [analyses]
      summary: List all notifications
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    patch:
      operationId: markAllNotificationsRead
      tags: [analyses]
      summary: Mark all notifications as read
      responses:
        "204":
          description: All marked read

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [analyses]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SystemServiceStatus:
      type: object
      properties:
        configured:
          type: boolean
        label:
          type: string
        detail:
          type: string
      required:
        - configured
        - label
        - detail

    PdfExportStatus:
      type: object
      properties:
        configured:
          type: boolean
        label:
          type: string
        detail:
          type: string
        availableCompilers:
          type: array
          items:
            type: string
            enum: [tectonic, latexmk, pdflatex]
      required:
        - configured
        - label
        - detail
        - availableCompilers

    SystemStatus:
      type: object
      properties:
        status:
          type: string
          enum: [operational, degraded]
        services:
          type: object
          properties:
            ai:
              $ref: "#/components/schemas/SystemServiceStatus"
            jobSearch:
              $ref: "#/components/schemas/SystemServiceStatus"
            pdfExport:
              $ref: "#/components/schemas/PdfExportStatus"
          required:
            - ai
            - jobSearch
            - pdfExport
      required:
        - status
        - services

    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/ApiError"
      required:
        - error

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterMs:
          type: number
      required:
        - code
        - message

    Analysis:
      type: object
      properties:
        id:
          type: integer
        jobTitle:
          type: string
        companyName:
          type: ["string", "null"]
        resumeText:
          type: string
        originalFileName:
          type: ["string", "null"]
        originalFileType:
          type: string
          enum: [pdf, latex, text]
        sourceLatex:
          type: ["string", "null"]
        optimizedLatex:
          type: ["string", "null"]
        jobDescriptionText:
          type: string
        fitScore:
          type: integer
        fitRationale:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        atsKeywordsMatched:
          type: array
          items:
            type: string
        atsKeywordsMissing:
          type: array
          items:
            type: string
        atsScore:
          type: integer
        coverLetter:
          type: ["string", "null"]
        linkedinPost:
          type: ["string", "null"]
        status:
          type: string
          enum: [not_applied, applied, got_interview, got_online_exam, selected, rejected]
        isFavorite:
          type: boolean
        notes:
          type: ["string", "null"]
        shareToken:
          type: ["string", "null"]
        isPublic:
          type: boolean
        deadline:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        followUpDate:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        portfolioLinks:
          type: array
          items:
            type: string
        versionLabel:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salaryExpectation:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - jobTitle
        - companyName
        - resumeText
        - originalFileName
        - originalFileType
        - sourceLatex
        - optimizedLatex
        - jobDescriptionText
        - fitScore
        - fitRationale
        - strengths
        - gaps
        - improvements
        - atsKeywordsMatched
        - atsKeywordsMissing
        - atsScore
        - coverLetter
        - linkedinPost
        - status
        - isFavorite
        - notes
        - shareToken
        - isPublic
        - deadline
        - contactName
        - contactEmail
        - followUpDate
        - tags
        - createdAt

    CreateAnalysisBody:
      type: object
      properties:
        jobTitle:
          type: string
        companyName:
          type: string
        resumeText:
          type: string
        originalFileName:
          type: string
        originalFileType:
          type: string
          enum: [pdf, latex, text]
        sourceLatex:
          type: string
        jobDescriptionText:
          type: string
      required:
        - jobTitle
        - resumeText
        - jobDescriptionText

    UpdateAnalysisBody:
      type: object
      properties:
        status:
          type: string
          enum: [not_applied, applied, got_interview, got_online_exam, selected, rejected]
        notes:
          type: string
        isFavorite:
          type: boolean
        deadline:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        followUpDate:
          type: string
        tags:
          type: array
          items:
            type: string
        portfolioLinks:
          type: array
          items:
            type: string
        versionLabel:
          type: string
        location:
          type: string
        salaryExpectation:
          type: string

    ShareResponse:
      type: object
      properties:
        shareToken:
          type: string
        shareUrl:
          type: string
      required:
        - shareToken
        - shareUrl

    FetchJobBody:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    FetchJobResponse:
      type: object
      properties:
        jobDescription:
          type: string
        jobTitle:
          type: string
        companyName:
          type: string
      required:
        - jobDescription

    JobSearchBody:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 2000
        numResults:
          type: integer
          minimum: 1
          maximum: 15
        offset:
          type: integer
          minimum: 0
          description: Exa pagination offset for loading more results.
        searchType:
          type: string
          enum:
            - auto
            - fast
            - instant
            - deep-lite
            - deep
            - deep-reasoning
        userLocation:
          type: string
          description: Two-letter ISO country code (Exa `userLocation`)
          pattern: "^[A-Z]{2}$"
        recentOnly:
          type: boolean
          description: When true, sets `startPublishedDate` to roughly the last 45 days (not used with people/company category).
        skipHeuristicAnalysis:
          type: boolean
          description: When true, sends your query to Exa as typed (no location/recency inference or query rewriting). Exa still receives a job-focused system prompt and highlight hints.
        filters:
          type: object
          properties:
            experienceLevel:
              type: string
              enum: [entry, mid, senior, lead, executive]
            jobType:
              type: string
              enum: [full-time, contract, part-time, internship, freelence]
            remote:
              type: string
              enum: [remote, hybrid, on-site]
            salaryMin:
              type: string
            industry:
              type: string
            companySize:
              type: string
              enum: [startup, mid-size, enterprise]
      required:
        - query

    JobSearchAnalysis:
      type: object
      required:
        - intentSummary
        - optimizedQuery
        - inferredLocation
        - recentBias
        - additionalQueries
        - effectiveSearchType
      properties:
        intentSummary:
          type: string
          description: Short summary of how the server interpreted the prompt (location, recency, remote, etc.).
        optimizedQuery:
          type: string
          description: The main query string sent to Exa after cleaning and job-context injection.
        inferredLocation:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code passed to Exa as userLocation when applicable.
        recentBias:
          type: boolean
          description: Whether results were biased toward more recently published pages.
        additionalQueries:
          type: array
          items:
            type: string
          description: Extra query variations used with Exa deep-style search for broader coverage.
        effectiveSearchType:
          type: string
          enum:
            - auto
            - fast
            - instant
            - deep-lite
            - deep
            - deep-reasoning
          description: Exa search type used after applying heuristics (e.g. auto may upgrade to deep for complex prompts).

    JobSearchHit:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        publishedDate:
          type: string
          nullable: true
        highlights:
          type: array
          items:
            type: string
        favicon:
          type: string
          nullable: true
        applyType:
          type: string
          enum: [ats, external, unknown]
          description: Whether the job is on an ATS (easy apply), external job board, or unknown.
        salary:
          type: string
          nullable: true
          description: Extracted salary range from highlights, if detected.
      required:
        - title
        - url

    JobSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/JobSearchHit"
        requestId:
          type: string
        searchType:
          type: string
        analysis:
          $ref: "#/components/schemas/JobSearchAnalysis"
        metadata:
          $ref: "#/components/schemas/SearchMetadata"
        hasMore:
          type: boolean
          description: Whether more results are available via offset pagination.
        nextOffset:
          type: integer
          description: The offset to use for the next page of results.
      required:
        - results
        - analysis

    SearchMetadata:
      type: object
      properties:
        totalFound:
          type: integer
        rankingStats:
          type: object
          properties:
            highQuality:
              type: integer
            mediumQuality:
              type: integer
            filtered:
              type: integer
        applyTypeBreakdown:
          type: object
          properties:
            ats:
              type: integer
            external:
              type: integer
            unknown:
              type: integer
        cities:
          type: array
          items:
            type: string
        companies:
          type: array
          items:
            type: string
        searchDurationMs:
          type: integer
        cachedResult:
          type: boolean

    EnrichJobBody:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The job posting URL to crawl via Exa /contents.
        title:
          type: string
          maxLength: 500
          description: Optional title hint to help the structured extractor.

    EnrichJobResponse:
      type: object
      required:
        - url
        - cached
        - requirements
        - responsibilities
      properties:
        url:
          type: string
        fullDescription:
          type: string
          nullable: true
          description: Full markdown text of the job posting page.
        summary:
          type: string
          nullable: true
          description: Two-sentence overview of the role.
        location:
          type: string
          nullable: true
        employmentType:
          type: string
          nullable: true
          description: e.g. full-time, contract, part-time, internship, freelance.
        postedDate:
          type: string
          nullable: true
          description: ISO date if detected.
        compensation:
          type: string
          nullable: true
          description: Salary range or pay band if mentioned.
        requirements:
          type: array
          items:
            type: string
        responsibilities:
          type: array
          items:
            type: string
        cached:
          type: boolean
          description: True when the response was served from the in-memory cache.

    GenerateCoverLetterBody:
      type: object
      properties:
        tone:
          type: string

    RewriteBulletBody:
      type: object
      properties:
        bulletText:
          type: string
      required:
        - bulletText

    RewriteBulletResponse:
      type: object
      properties:
        original:
          type: string
        rewritten:
          type: string
      required:
        - original
        - rewritten

    GeneratedContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    AnalysisStats:
      type: object
      properties:
        totalAnalyses:
          type: integer
        averageFitScore:
          type: number
        averageAtsScore:
          type: number
        topMissingKeywords:
          type: array
          items:
            type: string
      required:
        - totalAnalyses
        - averageFitScore
        - averageAtsScore
        - topMissingKeywords

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deadline, follow_up, info]
        title:
          type: string
        body:
          type: string
        analysisId:
          type: ["integer", "null"]
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - body
        - analysisId
        - read
        - createdAt

    MarkNotificationReadParams:
      type: object
      properties:
        id:
          type: integer
      required:
        - id
